name: SA Calculator v98.98 - Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sa-calculator-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Verify v98.98 source, tests and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The project intentionally has no package-lock.json. Cache only npm's
      # download store; never create or commit an incidental lockfile in CI.
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Set up Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Select exact v98.98 source archive or repository root
        id: locate
        env:
          SA_EXPECTED_VERSION: '1.99.12-v98.98'
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const workspace = process.env.GITHUB_WORKSPACE;
          const expectedVersion = process.env.SA_EXPECTED_VERSION;
          if (!expectedVersion) throw new Error('SA_EXPECTED_VERSION is required.');
          const candidates = [];
          const rootManifest = path.join(workspace, 'package.json');
          if (fs.existsSync(rootManifest)) {
            const pkg = JSON.parse(fs.readFileSync(rootManifest, 'utf8'));
            if (pkg.name === 'sa-calculator' && pkg.version) candidates.push({kind:'root',version:pkg.version,appDir:workspace,tie:0});
          }
          const findArchives = (dir, depth=0) => {
            if (depth > 5) return [];
            let found=[];
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              if (['.git','node_modules','.gradle','build','www'].includes(ent.name)) continue;
              const full=path.join(dir,ent.name);
              if (ent.isDirectory()) found.push(...findArchives(full,depth+1));
              else if (/^SA-Calculator-v.*\.zip$/i.test(ent.name)) found.push(full);
            }
            return found;
          };
          const rootIsExact = candidates.some(x => x.kind === 'root' && x.version === expectedVersion);
          for (const archive of (rootIsExact ? [] : findArchives(workspace).sort())) {
            cp.execFileSync('unzip',['-tq',archive],{stdio:'inherit'});
            const entries=cp.execFileSync('unzip',['-Z1',archive],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);
            for (const entry of entries) if (entry.startsWith('/') || entry.split('/').includes('..')) throw new Error(`Unsafe ZIP path: ${archive}:${entry}`);
            const manifests=entries.filter(x=>/(^|\/)package\.json$/.test(x)&&!/(^|\/)(node_modules|www|android|\.git)\//.test(x));
            if (manifests.length!==1) throw new Error(`${archive}: expected exactly one app package.json, found ${manifests.length}`);
            const pkg=JSON.parse(cp.execFileSync('unzip',['-p',archive,manifests[0]],{encoding:'utf8'}));
            if (pkg.name!=='sa-calculator'||!pkg.version) throw new Error(`${archive}: invalid SA Calculator manifest`);
            if (pkg.version!==expectedVersion) { console.log(`Ignoring stale archive ${archive} (${pkg.version})`); continue; }
            const key=crypto.createHash('sha256').update(archive).digest('hex').slice(0,12);
            const extractDir=path.join(os.tmpdir(),`sa-calculator-${pkg.version.replace(/[^a-zA-Z0-9.-]/g,'-')}-${key}`);
            fs.rmSync(extractDir,{recursive:true,force:true}); fs.mkdirSync(extractDir,{recursive:true});
            cp.execFileSync('unzip',['-q',archive,'-d',extractDir]);
            candidates.push({kind:'archive',version:pkg.version,appDir:path.dirname(path.join(extractDir,manifests[0])),archive,tie:1});
          }
          const exact=candidates.filter(x=>x.version===expectedVersion);
          if (!exact.length) throw new Error(`Exact source ${expectedVersion} not found. Available: ${[...new Set(candidates.map(x=>x.version))].join(', ')||'none'}`);
          // Prefer the checked-out repository when it is exact. Only extract an
          // archive when the checkout is stale; duplicate same-version archives
          // must have identical bytes or fail with a clear ambiguity diagnostic.
          const rootExact=exact.find(x=>x.kind==='root');
          let selected=rootExact;
          if(!selected){
            const archives=exact.filter(x=>x.kind==='archive');
            if(!archives.length) throw new Error(`No exact source archive for ${expectedVersion}`);
            const hashes=archives.map(x=>({item:x,hash:crypto.createHash('sha256').update(fs.readFileSync(x.archive)).digest('hex')}));
            const unique=new Set(hashes.map(x=>x.hash));
            if(unique.size>1) throw new Error(`Multiple different exact source archives found: ${archives.map(x=>x.archive).join(', ')}`);
            selected=archives[0];
          }
          const appDir=fs.realpathSync(selected.appDir);
          const pkg=JSON.parse(fs.readFileSync(path.join(appDir,'package.json'),'utf8'));
          if(pkg.version!==expectedVersion) throw new Error(`Stale source selected: ${pkg.version}`);
          const code=Number(pkg.androidVersionCode);
          if(!Number.isSafeInteger(code)||code<1||code>2100000000) throw new Error(`Invalid androidVersionCode: ${pkg.androidVersionCode}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`app_dir=${appDir}\napp_version=${pkg.version}\nandroid_version_code=${code}\n`);
          console.log(`Selected ${selected.kind}: ${appDir}`); console.log(`Exact release: ${pkg.version} (${code})`);
          NODE

      - name: Verify source files, release identity and test entry points
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const path=require('node:path');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const expected='1.99.12-v98.98';
          if(p.name!=='sa-calculator'||p.version!==expected) throw new Error(`Expected ${expected}, found ${p.name} ${p.version}`);
          if(p.androidVersionCode!==1099118) throw new Error(`Unexpected Android versionCode ${p.androidVersionCode}`);
          for(const f of ['index.html','manifest.webmanifest','service-worker.js','capacitor.config.json','assets/js/app.js','assets/css/app.css','assets/css/tool-reference-ui.css','assets/js/localization.js','assets/js/theme-bootstrap.js','scripts/prepare-android-web.mjs','scripts/patch-android-native.mjs','tests/tool-restoration-regression-v9870.test.mjs','tests/tool-reference-video-regression-v9873.test.mjs','tests/tool-reference-finance-regression-v9881.test.mjs','tests/tool-ui-polish-v9881.test.mjs','tests/action-time-reference-video-regression-v98811.test.mjs','tests/reference-video-exact-v9881.test.mjs','tests/action-time-lifecycle-hardening-v9881.test.mjs','tests/action-time-ui-geometry-v9881.test.mjs','tests/action-time-gst-unit-v9881.test.mjs','tests/gst-keypad-video-audit-v9882.test.mjs','tests/gst-field-boundary-cleanup-v9883.test.mjs','tests/gst-white-theme-layout-v9884.test.mjs','tests/tool-cursor-layer-regression-v9885.test.mjs','tests/gst-action-time-layout-caret-v9886.test.mjs','tests/gst-pixel-geometry-v9887.test.mjs','tests/gst-placeholder-layout-regression-v9888.test.mjs','tests/gst-row-placeholder-caret-v9889.test.mjs','tests/gst-dual-recording-micro-regression-v9890.test.mjs','tests/gst-rate-layout-state-regression-v9891.test.mjs','tests/gst-rate-position-placeholder-preset-v9892.test.mjs','tests/tool-wide-field-contract-v9893.test.mjs','tests/tool-card-geometry-v9894.test.mjs','tests/tool-card-content-geometry-v9896.test.mjs','assets/brand/sa-calculator-icon.png','assets/brand/sa-calculator-192.png','assets/brand/sa-calculator-512.png','assets/icons/ref-banknote.svg','assets/icons/ref-chart.svg','assets/icons/ref-calendar.svg','assets/icons/ref-scale.svg','assets/icons/ref-percent.svg','assets/icons/ref-people.svg','assets/icons/ref-dollar.svg']) {
            if(!fs.existsSync(f)||!fs.statSync(f).isFile()||fs.statSync(f).size===0) throw new Error(`Required release file missing/empty: ${f}`);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes(expected)) throw new Error('HTML build version mismatch');
          const app=fs.readFileSync('assets/js/app.js','utf8');
          if(!app.includes(`const APP_VERSION = '${expected}'`)) throw new Error('Runtime APP_VERSION mismatch');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(manifest.version!==expected) throw new Error('PWA manifest version mismatch');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const expectedCache='sa-calculator-v98-98-tool-form-cardless-v9898';
          const cacheMatch=sw.match(/^const CACHE='([^']+)'/m);
          if(!cacheMatch||cacheMatch[1]!==expectedCache) throw new Error(`Service worker cache namespace mismatch: expected ${expectedCache}, found ${cacheMatch?.[1]||'missing'}`);
          const cap=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          if(cap.webDir!=='www') throw new Error(`Capacitor webDir must be www, got ${cap.webDir}`);
          for(const name of ['test','test:release','build:web']) if(!p.scripts?.[name]) throw new Error(`Missing npm script ${name}`);
          for(const dep of ['@capacitor/core','@capacitor/android']) if(!p.dependencies?.[dep]) throw new Error(`Missing ${dep}`);
          if(!p.devDependencies?.['@capacitor/cli']) throw new Error('Missing @capacitor/cli');
          const command=p.scripts['test:release'];
          const testFiles=[...command.matchAll(/(?:^|\s)(tests\/[^\s]+)/g)].map(m=>m[1]);
          if(!testFiles.length) throw new Error('Release test entry point contains no explicit tests');
          for(const f of testFiles) if(!fs.existsSync(f)) throw new Error(`Release test entry point references missing file: ${f}`);
          console.log(`Verified ${p.version}; ${testFiles.length} explicit release test files.`);
          NODE

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK" || { echo '::error::Android SDK path missing'; exit 1; }
          test -x "$SDK/platform-tools/adb" || { echo '::error::adb missing'; exit 1; }
          test -d "$SDK/platforms/android-35" || { echo '::error::Android API 35 missing'; exit 1; }
          test -x "$SDK/build-tools/35.0.0/aapt" || { echo '::error::aapt 35.0.0 missing'; exit 1; }
          "$SDK/platform-tools/adb" version
          "$SDK/build-tools/35.0.0/aapt" version

      - name: Validate release JavaScript syntax before dependency install
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/app.js
          node --check assets/js/localization.js
          node --check assets/js/theme-bootstrap.js
          node --check server.js
          node --check service-worker.js
          node --check scripts/prepare-android-web.mjs
          node --check scripts/patch-android-native.mjs
          echo 'Release JavaScript syntax validation passed before dependency installation.'

      - name: Install npm dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm install --no-package-lock --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000

      - name: Verify installed dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm ls --depth=0

      - name: Validate JavaScript syntax
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/app.js
          node --check assets/js/localization.js
          node --check assets/js/theme-bootstrap.js
          node --check server.js
          node --check service-worker.js
          node --check scripts/prepare-android-web.mjs
          node --check scripts/patch-android-native.mjs

      - name: Build Android web bundle
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm run build:web

      - name: Run v98.98 release regression suite
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm run test:release

      - name: Verify freshly generated Android web bundle
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          for(const f of ['www/index.html','www/manifest.webmanifest','www/service-worker.js','www/assets/js/app.js','www/assets/js/localization.js','www/assets/js/theme-bootstrap.js','www/assets/css/app.css','www/assets/brand/sa-calculator-icon.png','www/assets/brand/sa-calculator-192.png','www/assets/brand/sa-calculator-512.png','www/assets/brand/sa-calculator-home-logo.svg','www/assets/brand/sa-home-neon-wave.svg']) if(!fs.existsSync(f)||fs.statSync(f).size===0) throw new Error(`Generated web asset missing: ${f}`);
          const root=fs.readFileSync('assets/js/app.js','utf8'); const built=fs.readFileSync('www/assets/js/app.js','utf8');
          if(root!==built) throw new Error('Generated app.js differs from authoritative source');
          for(const name of ['app.css','tool-reference-ui.css']) { const css=fs.readFileSync(`assets/css/${name}`,'utf8'); if(css!==fs.readFileSync(`www/assets/css/${name}`,'utf8')) throw new Error(`Generated ${name} differs from authoritative source`); }
          if(!fs.readFileSync('www/index.html','utf8').includes('1.99.12-v98.98')) throw new Error('Generated HTML has stale version');
          console.log('Fresh web bundle is complete and byte-matched to source.');
          NODE

      - name: Generate Android project if missing
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -s android/gradlew ]; then
            echo 'Existing Android Gradle wrapper found.'
          elif [ ! -e android ]; then
            npx cap add android
          else
            echo '::error::Android directory exists but Gradle wrapper is missing; refusing destructive replacement.'
            exit 1
          fi

      - name: Sync Capacitor Android
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npx cap sync android

      - name: Apply Android launcher icon, splash and edge-to-edge configuration
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm run android:brand

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.locate.outputs.app_dir }}/android
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android debug APK
        working-directory: ${{ steps.locate.outputs.app_dir }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK identity and checksum
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          test -x "$AAPT" || { echo '::error::aapt missing'; exit 1; }
          BADGING=$("$AAPT" dump badging "$APK")
          grep -F "versionName='${{ steps.locate.outputs.app_version }}'" <<< "$BADGING"
          grep -F "versionCode='${{ steps.locate.outputs.android_version_code }}'" <<< "$BADGING"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SA-Calculator-Debug-APK-${{ steps.locate.outputs.app_version }}
          path: ${{ steps.locate.outputs.app_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo 'Build failed. Inspect the first failed step above; this is the diagnostic summary.'
          echo "Runner: $RUNNER_OS"
          node --version || true
          npm --version || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
